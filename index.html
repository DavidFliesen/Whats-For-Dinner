<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>What’s 4 Dinner?</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { brand: { navy: '#152033', orange: '#f77f00' } } } }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-dark { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans selection:bg-orange-100 selection:text-orange-900">

  <!-- Clean White Header -->
  <header class="bg-white w-full border-b border-slate-100">
    <div class="max-w-5xl mx-auto px-4 py-2 flex items-center justify-between">
      <a href="#" class="flex items-center gap-3 select-none">
        <svg class="h-14 sm:h-16 w-auto" viewBox="0 0 340 180" preserveAspectRatio="xMidYMid meet" style="aspect-ratio: 340/180;" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="85" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#152033" letter-spacing="-0.5">What’s</text>
          <text x="245" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#f77f00">4</text>
          <path d="M26 155V101M26 101V70C26 66 22 66 22 66V42M26 70C26 66 30 66 30 66V42M26 70V42" stroke="#f77f00" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 155C19 159 33 159 33 155V103H19V155Z" fill="#f77f00"/>
          <path d="M45 44H75C110 44 135 68 135 100C135 132 110 155 75 155H45V44Z" stroke="#152033" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M60 62C88 68 110 81 110 100C110 119 88 132 60 138" stroke="#f77f00" stroke-width="7" stroke-linecap="round"/>
          <text x="138" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="62" font-weight="800" fill="#152033" letter-spacing="-1">inner?</text>
        </svg>
      </a>
      <button id="surpriseBtn" class="flex items-center gap-1.5 px-4 py-2 bg-brand-orange text-white hover:bg-[#e67600] font-bold text-xs sm:text-sm rounded-full transition shadow-md">
        <i data-lucide="sparkles" class="w-4 h-4"></i><span class="hidden sm:inline">Decide For Me</span>
      </button>
    </div>
  </header>

  <!-- Dark Navy Control Banner -->
  <div class="bg-brand-navy w-full px-4 py-8 mb-8 sm:rounded-b-3xl shadow-lg max-w-5xl mx-auto">
    <p class="text-slate-300 text-sm mb-6 max-w-xl">Select Eat In or Dine Out to get immediate healthy options matching your clinical preferences.</p>
    
    <!-- Mode Toggle -->
    <div class="glass-dark p-1.5 rounded-2xl flex font-bold text-sm max-w-md shadow-inner mb-5">
      <button id="modeEatIn" class="flex-1 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all text-slate-400 hover:text-white"><i data-lucide="chef-hat" class="w-4 h-4"></i><span>Eat In</span></button>
      <button id="modeDineOut" class="flex-1 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all bg-brand-orange text-white shadow-md"><i data-lucide="utensils" class="w-4 h-4"></i><span>Dine Out</span></button>
    </div>

    <!-- Location Bar -->
    <div id="locationBar" class="glass-dark p-3.5 rounded-xl flex items-center gap-3 max-w-2xl border border-slate-600/50">
      <i data-lucide="map-pin" class="w-5 h-5 text-brand-orange shrink-0"></i>
      <input type="text" id="locationInput" value="Global JSON Data Active" readonly class="w-full text-sm font-semibold text-slate-200 focus:outline-none bg-transparent cursor-default">
      <i data-lucide="crosshair" class="w-5 h-5 text-slate-400 shrink-0"></i>
    </div>
  </div>

  <main class="max-w-5xl mx-auto px-4 w-full flex-1">
    <!-- Dietary Filters -->
    <div class="mb-6">
      <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1 mb-3">
        <span>Dietary & Health Profiles</span><button id="clearFilters" class="text-brand-orange hover:underline normal-case font-semibold">Reset</button>
      </div>
      <div class="flex gap-2.5 overflow-x-auto pb-2 no-scrollbar text-xs">
        <button data-filter="glp1" class="filter-pill flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 bg-white font-bold hover:border-emerald-300 transition whitespace-nowrap shadow-sm"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>GLP-1 Friendly</span></button>
        <button data-filter="lowSodium" class="filter-pill flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 bg-white font-bold hover:border-blue-300 transition whitespace-nowrap shadow-sm"><span class="w-2 h-2 rounded-full bg-blue-500"></span><span>Low Sodium (<500mg)</span></button>
        <button data-filter="lowCal" class="filter-pill flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 bg-white font-bold hover:border-amber-300 transition whitespace-nowrap shadow-sm"><span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Low Calorie (<450 kcal)</span></button>
        <button data-filter="highProtein" class="filter-pill flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 bg-white font-bold hover:border-purple-300 transition whitespace-nowrap shadow-sm"><span class="w-2 h-2 rounded-full bg-purple-500"></span><span>High Protein (>30g)</span></button>
      </div>
    </div>

    <!-- Results Status -->
    <div class="flex items-center justify-between px-1 mb-4">
      <span id="resultsCount" class="text-sm font-semibold text-slate-500">Loading meals...</span>
    </div>

    <!-- Meal Grid -->
    <div id="mealGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-12"></div>
  </main>

  <footer class="py-8 text-center border-t border-slate-200 bg-slate-100">
    <span class="text-xs font-bold text-slate-400">What’s 4 Dinner? • Version 1.3.1</span>
  </footer>

  <!-- Modal -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto shadow-2xl relative" id="modalContainer">
      <button id="closeModal" class="absolute top-4 right-4 p-2 bg-white/90 hover:bg-white rounded-full text-slate-900 shadow-md backdrop-blur-md transition z-10"><i data-lucide="x" class="w-5 h-5"></i></button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    let mealsData = [];
    let currentMode = 'dine-out';
    const activeFilters = new Set();
    const modeEatIn = document.getElementById('modeEatIn');
    const modeDineOut = document.getElementById('modeDineOut');
    const locationBar = document.getElementById('locationBar');
    const mealGrid = document.getElementById('mealGrid');
    const resultsCount = document.getElementById('resultsCount');
    const filterPills = document.querySelectorAll('.filter-pill');
    const clearFilters = document.getElementById('clearFilters');
    const detailModal = document.getElementById('detailModal');
    const modalContent = document.getElementById('modalContent');
    const closeModal = document.getElementById('closeModal');

    // Fetch Global JSON
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('./meals.json');
        if (!response.ok) throw new Error("Could not load meals.json");
        const data = await response.json();
        
        // Include default Eat In recipes
        const eatInDefaults = [
          {
            id: 'ei-1', type: 'eat-in', title: 'Lemon Herb Poached Salmon', calories: 380, protein: 38, sodium: 220, glp1: true, lowSodium: true, lowCal: true, highProtein: true,
            description: 'Gentle on digestion, nutrient-dense, and rich in omega-3s.',
            instructions: 'Poach salmon gently in simmering water for 9 mins. Serve with fresh lemon.'
          }
        ];
        mealsData = [...eatInDefaults, ...data];
        renderCards();
      } catch (err) {
        mealGrid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400"><p class="font-semibold">Add meals.json to the root folder to view menus.</p></div>';
        resultsCount.textContent = "0 Options";
      }
    });

    function setMode(mode) {
      currentMode = mode;
      if (mode === 'eat-in') {
        modeEatIn.className = 'flex-1 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all bg-white text-brand-navy shadow-sm';
        modeDineOut.className = 'flex-1 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all text-slate-400 hover:text-white';
        locationBar.classList.add('hidden');
      } else {
        modeDineOut.className = 'flex-1 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all bg-brand-orange text-white shadow-md';
        modeEatIn.className = 'flex-1 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all text-slate-400 hover:text-white';
        locationBar.classList.remove('hidden');
      }
      renderCards();
    }
    modeEatIn.addEventListener('click', () => setMode('eat-in'));
    modeDineOut.addEventListener('click', () => setMode('dine-out'));

    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        const filterKey = pill.getAttribute('data-filter');
        if (activeFilters.has(filterKey)) { 
          activeFilters.delete(filterKey); 
          pill.classList.remove('bg-orange-50', 'border-brand-orange', 'text-brand-orange'); 
          pill.classList.add('bg-white', 'border-slate-200'); 
        } else { 
          activeFilters.add(filterKey); 
          pill.classList.add('bg-orange-50', 'border-brand-orange', 'text-brand-orange'); 
          pill.classList.remove('bg-white', 'border-slate-200'); 
        }
        renderCards();
      });
    });

    clearFilters.addEventListener('click', () => {
      activeFilters.clear();
      filterPills.forEach(p => { p.classList.remove('bg-orange-50', 'border-brand-orange', 'text-brand-orange'); p.classList.add('bg-white', 'border-slate-200'); });
      renderCards();
    });

    window.launchGoogleMaps = function(venue, location) {
      const q = encodeURIComponent(`${venue} ${location}`);
      window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank', 'noopener,noreferrer');
    };

    function renderCards() {
      const filtered = mealsData.filter(item => {
        if (item.type !== currentMode) return false;
        for (const f of activeFilters) if (!item[f]) return false;
        return true;
      });
      resultsCount.textContent = `${filtered.length} healthy option${filtered.length === 1 ? '' : 's'}`;
      mealGrid.innerHTML = '';

      filtered.forEach(meal => {
        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition overflow-hidden cursor-pointer flex flex-col";
        card.onclick = () => openModal(meal.id);
        
        card.innerHTML = `
          <div class="h-32 bg-slate-200 relative flex items-center justify-center overflow-hidden">
             <i data-lucide="image" class="w-8 h-8 text-slate-300"></i>
             <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
          </div>
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              ${meal.type === 'dine-out' ? `<div class="text-[10px] text-brand-orange font-extrabold uppercase tracking-wider mb-1">${meal.venue}</div>` : ''}
              <h3 class="font-extrabold text-slate-900 text-lg leading-snug mb-3">${meal.title}</h3>
            </div>
            <div class="grid grid-cols-3 gap-1 py-2 px-1 bg-slate-50 rounded-xl text-center border border-slate-100 mt-2">
              <div><span class="block text-slate-400 text-[9px] font-bold">CAL</span><span class="font-bold text-slate-800 text-sm">${meal.calories}</span></div>
              <div class="border-x border-slate-200"><span class="block text-slate-400 text-[9px] font-bold">PRO</span><span class="font-bold text-slate-800 text-sm">${meal.protein}g</span></div>
              <div><span class="block text-slate-400 text-[9px] font-bold">NA+</span><span class="font-bold text-slate-800 text-sm">${meal.sodium}mg</span></div>
            </div>
          </div>
        `;
        mealGrid.appendChild(card);
      });
      lucide.createIcons();
    }

    window.openModal = function(id) {
      const meal = mealsData.find(m => m.id === id);
      if (!meal) return;
      modalContent.innerHTML = `
        <div class="h-48 bg-slate-200 relative flex items-center justify-center rounded-t-3xl overflow-hidden">
          <i data-lucide="image" class="w-12 h-12 text-slate-300"></i>
        </div>
        <div class="p-6">
          <h2 class="text-2xl font-extrabold text-slate-900 mb-1">${meal.title}</h2>
          ${meal.venue ? `<p class="text-xs font-bold text-brand-orange uppercase mb-4">${meal.venue} •${meal.location}</p>` : ''}
          
          <div class="grid grid-cols-3 gap-2 py-3 px-2 bg-orange-50 rounded-2xl text-center text-sm mb-6 border border-orange-100">
            <div><span class="block text-slate-400 text-[10px] font-bold">CALORIES</span><span class="font-extrabold text-slate-800 text-xl">${meal.calories}</span></div>
            <div><span class="block text-slate-400 text-[10px] font-bold">PROTEIN</span><span class="font-extrabold text-slate-800 text-xl">${meal.protein}g</span></div>
            <div><span class="block text-slate-400 text-[10px] font-bold">SODIUM</span><span class="font-extrabold text-slate-800 text-xl">${meal.sodium}mg</span></div>
          </div>

          ${meal.type === 'dine-out' ? `
            <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl mb-5">
              <h4 class="font-bold text-slate-900 text-sm mb-2 flex items-center gap-2"><i data-lucide="message-square" class="w-4 h-4 text-brand-orange"></i>Server Hack</h4>
              <p class="text-slate-700 font-medium text-sm leading-relaxed">"${meal.orderTip}"</p>
            </div>
            <button onclick="launchGoogleMaps('${meal.venue.replace(/'/g, "\\'")}', '${(meal.address||meal.location).replace(/'/g, "\\'")}')" class="w-full py-4 bg-brand-navy hover:bg-slate-800 text-white rounded-xl font-bold flex items-center justify-center gap-2 transition shadow-md"><i data-lucide="map-pin" class="w-5 h-5"></i> Navigate in Google Maps</button>
          ` : `
            <div class="space-y-3 mb-4">
              <p class="text-sm text-slate-600 font-medium">${meal.description}</p>
              <h4 class="font-bold text-slate-900 text-sm pt-2 border-t border-slate-100">Instructions:</h4>
              <p class="text-slate-700 font-medium text-sm leading-relaxed">${meal.instructions}</p>
            </div>
          `}
        </div>
      `;
      detailModal.classList.remove('hidden');
      detailModal.classList.add('flex');
      lucide.createIcons();
    };

    closeModal.addEventListener('click', () => { detailModal.classList.add('hidden'); detailModal.classList.remove('flex'); });
    detailModal.addEventListener('click', (e) => { if (e.target === detailModal) { detailModal.classList.add('hidden'); detailModal.classList.remove('flex'); } });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') { detailModal.classList.add('hidden'); detailModal.classList.remove('flex'); } });
    lucide.createIcons();
  </script>
</body>
</html>
