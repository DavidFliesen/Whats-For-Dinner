<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>What’s 4 Dinner?</title>
  <meta name="theme-color" content="#1d3557">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-orange-100 selection:text-orange-900">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-center relative">
      <a href="#" class="flex items-center select-none block">
        <svg class="h-16 md:h-20 w-auto" viewBox="0 0 340 180" preserveAspectRatio="xMidYMid meet" style="aspect-ratio: 340/180;" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="75" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" fill="#1d3557" letter-spacing="-0.5">What’s</text>
          <text x="215" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900" fill="#f77f00">4</text>
          <path d="M26 130V88M26 88V64C26 61 22 61 22 61V42M26 64C26 61 30 61 30 61V42M26 64V42" stroke="#f77f00" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 130C19 133 33 133 33 130V90H19V130Z" fill="#f77f00"/>
          <path d="M40 44H65C92 44 112 62 112 87C112 112 92 130 65 130H40V44Z" stroke="#1d3557" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M52 58C74 62 92 72 92 87C92 102 74 112 52 116" stroke="#f77f00" stroke-width="6" stroke-linecap="round"/>
          <text x="122" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#1d3557" letter-spacing="-0.5">inner?</text>
        </svg>
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-5 flex-1 w-full space-y-6">
    <div class="bg-slate-200/80 p-1.5 rounded-2xl flex font-semibold text-sm max-w-md mx-auto shadow-inner">
      <button id="modeEatIn" class="flex-1 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all bg-white text-brand-navy shadow-sm">
        <i data-lucide="chef-hat" class="w-4 h-4 text-orange-500"></i><span>Eat In</span>
      </button>
      <button id="modeDineOut" class="flex-1 py-2.5 rounded-xl flex items-center justify-center gap-2 transition-all text-slate-600 hover:text-slate-900">
        <i data-lucide="utensils" class="w-4 h-4 text-slate-500"></i><span>Dine Out</span>
      </button>
    </div>

    <div id="mealGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5 pb-8"></div>
  </main>

  <footer class="mt-auto py-6 border-t border-slate-200 bg-white text-center">
    <span class="text-xs font-semibold text-slate-400">What’s 4 Dinner? • Version 1.2.2</span>
  </footer>

  <div id="detailModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative">
      <button id="closeModal" class="fixed top-6 right-6 p-2 bg-slate-900/50 hover:bg-slate-900 text-white rounded-full transition z-[60]">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="modalContent" class="pb-6"></div>
    </div>
  </div>

  <script>
    const mealsData = [
      { id: '1', type: 'eat-in', title: 'Lemon Herb Salmon', calories: 380, protein: 38, sodium: 220, img: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=600&q=80', instructions: 'Grill salmon for 10 mins.' },
      { id: '2', type: 'dine-out', title: 'Grilled Mahi-Mahi', venue: 'Five Loaves Cafe', location: 'Summerville, SC', calories: 410, protein: 39, sodium: 380, orderTip: 'Ask for fish dry-grilled.', img: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=600&q=80', address: '214 N Cedar St, Summerville, SC 29483' }
    ];

    let currentMode = 'eat-in';

    document.getElementById('modeEatIn').onclick = () => { currentMode = 'eat-in'; renderCards(); };
    document.getElementById('modeDineOut').onclick = () => { currentMode = 'dine-out'; renderCards(); };

    function renderCards() {
      const grid = document.getElementById('mealGrid');
      grid.innerHTML = '';
      mealsData.filter(m => m.type === currentMode).forEach(meal => {
        grid.innerHTML += \`
          <div class="bg-white border rounded-2xl overflow-hidden shadow-sm flex flex-col">
            <img src="\${meal.img}" class="w-full h-48 object-cover cursor-pointer hover:opacity-90 transition" onclick="openModal('\${meal.id}')" alt="\${meal.title}">
            <div class="p-4 flex-1">
              <h3 class="font-bold text-lg cursor-pointer hover:text-orange-500" onclick="openModal('\${meal.id}')">\${meal.title}</h3>
              <button onclick="openModal('\${meal.id}')" class="mt-3 w-full py-2 bg-slate-900 text-white rounded-xl text-sm font-semibold">View Details</button>
            </div>
          </div>
        \`;
      });
      lucide.createIcons();
    }

    window.openModal = function(id) {
      const meal = mealsData.find(m => m.id === id);
      document.getElementById('modalContent').innerHTML = \`
        <img src="\${meal.img}" class="w-full h-64 object-cover">
        <div class="p-6">
          <h2 class="text-3xl font-extrabold mb-2">\${meal.title}</h2>
          \${meal.type === 'dine-out' ? \`
            <div class="p-4 bg-orange-50 rounded-xl mb-4 border border-orange-100">
              <p class="font-bold text-slate-800">Order Hack:</p>
              <p class="text-slate-600">\${meal.orderTip}</p>
            </div>
            <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=\${encodeURIComponent(meal.venue + ' ' + meal.address)}', '_blank', 'noopener,noreferrer')" class="w-full py-3 bg-brand-navy bg-slate-900 text-white rounded-xl font-bold flex items-center justify-center gap-2">
              <i data-lucide="map-pin" class="w-4 h-4"></i> Open in Google Maps
            </button>
          \` : \`<p>\${meal.instructions}</p>\`}
        </div>
      \`;
      document.getElementById('detailModal').classList.remove('hidden');
      lucide.createIcons();
    };

    document.getElementById('closeModal').onclick = () => document.getElementById('detailModal').classList.add('hidden');
    renderCards();
  </script>
</body>
</html>
